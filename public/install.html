<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Install MacDoc</title>
<link rel="stylesheet" href="/setup.css">
<style>
  .install { max-width: 560px; margin: 0 auto; padding: 48px 24px; }
  .install h1 { margin: 18px 0 6px; font-size: 28px; letter-spacing: -.03em; }
  .install p { color: var(--muted); }
  .install .card { margin-top: 20px; }
  .install .btn { margin-top: 8px; font-size: 16px; padding: 14px 22px; }
  .install ol { padding-left: 20px; color: var(--muted); line-height: 1.7; }
</style>
</head>
<body>
<main class="install">
  <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <h1>Install MacDoc on this tablet</h1>
  <p>For the first install, or if the app stops updating itself. After this, MacDoc updates over Wi-Fi on its own.</p>
  <div class="card" id="card"><p id="status">Checking your Mac for the app…</p></div>
</main>
<script type="module">
const card = document.getElementById("card");
const res = await fetch("/api/app/latest", { credentials: "same-origin" });
if (res.status === 401) {
  card.innerHTML = '<h3>Pair this browser first</h3><ol><li>Open <a href="/">MacDoc in this browser</a> and enter your PIN.</li><li>Come back to <code>/install</code>.</li></ol>';
} else {
  const latest = await res.json();
  card.innerHTML = latest.available
    ? '<h3>MacDoc ' + latest.versionName + '</h3><p>' + (latest.bytes / 1048576).toFixed(1) + ' MB · Android 7.0 or newer</p><a class="btn" href="/api/app/apk" download>Download the app</a><ol><li>Open the downloaded file.</li><li>If Android asks, allow this browser to install apps.</li><li>Tap Install, then open MacDoc.</li></ol>'
    : '<h3>No app published yet</h3><p>On the Mac, run <code>npm run android:update</code>, then reload this page.</p>';
}
</script>
</body>
</html>
